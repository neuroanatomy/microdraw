<!DOCTYPE html>
<html lang="en">
<head>
    <title>MicroDraw Overlays</title>
    <style>
        #ctrl {
            position: absolute;
            display: block;
            top: 0;
            left: 0;
            width: 200px;
            height: 300px;
            background: #aaa;
            border: thin solid black;
            margin: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <svg>
      <filter id="discrete">
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.2 0.3 0.5 0.6 1"/>
          <feFuncG type="discrete" tableValues="1 0.8 0.6 0.5 0.3 0"/>
          <feFuncB type="discrete" tableValues="0 0.3 0.5 0.7 0.5 0"/>
        </feComponentTransfer>
      </filter>
    </svg>
    <div
        id="invisible"
        style="position:fixed;display:block;top:0;left:0;width:100%;height:100%;z-index:999">
    </div>
    <div id="ctrl">
        Layer 1<br />
        <input
            type="range"
            id="slider1"
            value="0"
            min="0"
            max="100"
            style="width:90%"
            oninput="changeOpacity"
        /> <br />
        Layer 2<br />
        <input
            type="range"
            id="slider2"
            value="50"
            min="0"
            max="100"
            style="width:90%"
            oninput="changeOpacity(this)"
        /> <br />
    </div>
    <script>
    const changeOpacity = (e) => {
        const id = e.id;
        const value = Number(e.value);

        let iframe;
        if (id === "slider1") {
            iframe = document.getElementById("p1");
        } else {
            iframe = document.getElementById("p2");
        }
        iframe.style.opacity = value / 100;
    };

    const superimposePage = (url, id, opacity, zIndex) => {
      const iframe = document.createElement('iframe');
      iframe.id = id;
      iframe.src = url;
      iframe.style.position = 'absolute';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.opacity = opacity/100; // 50% transparency
      iframe.style.zIndex = zIndex; // Make sure it's on top of other elements
      document.body.appendChild(iframe);
      return iframe;
    }

    const passEvents = (event) => {
        if (event.target.id !== "invisible") { return; }
        event.preventDefault();
        var evt = new Event(event.type);
        for (const key of [
            'button', 'buttons', 'width', 'height', 'deltaY', 'position', 'clientX', 'clientY', 'pageX', 'pageY',
            'pointerId', 'pointerType', 'isPrimary']) {
            evt[key] = event[key];
        }

        const contentWindow1 = document.querySelector("#p1").contentWindow;
        const shadowRoot1 = contentWindow1.document.querySelector("#content").shadowRoot;
        const target1 = shadowRoot1.querySelector("#openseadragon1 > div > div.openseadragon-canvas");
        target1.dispatchEvent(evt);

        const contentWindow2 = document.querySelector("#p2").contentWindow;
        const shadowRoot2 = contentWindow2.document.querySelector("#content").shadowRoot;
        const target2 = shadowRoot2.querySelector("#openseadragon1 > div > div.openseadragon-canvas");
        target2.dispatchEvent(evt);
    }

    const injectSVGFilterEffect = (sel) => {
        const contentWindow2 = document.querySelector(sel).contentWindow;

        // keep trying until the shadowRoot is available
        const shadowRoot2 = contentWindow2.document.querySelector("#content").shadowRoot;
        if (shadowRoot2 === null) {
            setTimeout(() => {injectSVGFilterEffect(sel);}, 1000);
            return;
        }

        const target2 = shadowRoot2.querySelector("#openseadragon1 > div > .openseadragon-canvas > canvas");
        // keep trying until the target2 is available
        if (target2 === null) {
            setTimeout(() => {injectSVGFilterEffect(sel);}, 1000);
            return;
        }

        const svg = document.createElement("svg");
        target2.parentElement.insertAdjacentElement(`beforeend`, svg);

        const filter = document.createElementNS("http://www.w3.org/2000/svg", 'filter');
        filter.id = "colormap";
        filter.innerHTML = `
        <feComponentTransfer>
            <feFuncR type="discrete" tableValues="0 1"></feFuncR
            <feFuncG type="discrete" tableValues="0 0"></feFuncG>
            <feFuncB type="discrete" tableValues="0 0"></feFuncB>
            <feFuncA type="discrete" tableValues="0 1"></feFuncA>
        </feComponentTransfer>`;
        svg.append(filter);
        target2.style.filter = "url(#colormap)";
    }

    // Call the function to inject web page2 after the web page1 content is loaded
    window.addEventListener('load', () => {
        const iframe1 = superimposePage(
            "/data?source=https%3A%2F%2Fbigbrain-ftp.loris.ca%2Fbigbrain-ftp%2FBigBrainRelease.2015%2FMicroDraw%2FMacaque_CellBody_071%2F41759_N_071.json&slice=0&displayTools=false",
            "p1", 100, 100);

        const iframe2 = superimposePage(
            // "/data?source=https%3A%2F%2Fbigbrain-ftp.loris.ca%2Fbigbrain-ftp%2FBigBrainRelease.2015%2FMicroDraw%2FMacaque_Annotations_071%2F41759_labels_071.json&slice=0&displayTools=false",
            "/data?source=https%3A%2F%2Fbigbrain-ftp.loris.ca%2Fbigbrain-ftp%2FBigBrainRelease.2015%2FMicroDraw%2FMacaque_Annotations_071%2F41759_labels_071_spectral.json&slice=0&displayTools=false",
            // "/data?source=https%3A%2F%2Fbigbrain-ftp.loris.ca%2Fbigbrain-ftp%2FBigBrainRelease.2015%2FMicroDraw%2FMacaque_Annotations_071%2F41759_labels_071_grayscale.json&slice=0&displayTools=false",
            "p2", 50, 101);

        for (const eventType of [
            'pointerover', 'pointerout', 'pointerdown', 'pointerup',
            'pointermove','pointercancel',
            'wheel']) {
            window.addEventListener(eventType, passEvents, {passive: false});
        }

        // inject svg filter effects into #p2 (for coloring)
        iframe2.onload = () => {
            // injectSVGFilterEffect("#p2");
            iframe2.style.mixBlendMode = "screen"; // "overlay"; // 
        };
    });
  </script>
</body>
</html>
