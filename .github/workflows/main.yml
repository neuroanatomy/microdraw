name: CI
on:
  push:
    branches:
      - "**"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_TEST: 127.0.0.1:27017/circleci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: 4.2
      - name: Install dependencies
        run: npm install --loglevel=verbose --foreground-scripts
        timeout-minutes: 8
      # puppeteer 21's postinstall fails to download Chrome on Node 26 (yargs
      # ESM, D20) but exits 0. Download it through nyc and fail if it is missing.
      - name: Download Chrome for puppeteer
        run: |
          npx nyc --silent node node_modules/puppeteer/install.js
          npx nyc --silent node -e "require('fs').accessSync(require('puppeteer').executablePath())"
      - run: npm run build-pages
      - name: Instantiate github-keys.json
        run: |
          echo "{ \"clientID\": \"clientID\", \"clientSecret\": \"clientSecret\", \"callbackURL\": \"http://localhost:3000/auth/github/callback\"}" > app/auth/github-keys.json
          mkdir test/e2e/auth
          cp app/auth/github-keys.json $_
      - name: Instantiate configuration file
        run: cp cfg.json.example cfg.json
      - name: Instantiate blacklist
        run: echo {} > app/controller/microdrawWebsocketServer/blacklist.json
      - name: Instantiate whitelist
        run: echo "{}" > app/controller/microdrawWebsocketServer/whitelist.json
      - name: Run the server during 5 seconds
        run: timeout 5 npm start && exit 10 || [[ $? -eq 124 ]]
      - name: Run api tests
        run: npm run mocha
      - name: Run e2e tests
        run: npm run test-e2e
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/e2e/screenshots/

  # Canary: same steps on the next Node major (NODE-POLICY.md). Non-blocking;
  # breakage here is an early warning, not a release gate.
  test-canary:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_TEST: 127.0.0.1:27017/circleci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
      - uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: 4.2
      - name: Install dependencies
        run: npm install --loglevel=verbose --foreground-scripts
        timeout-minutes: 8
      # puppeteer 21's postinstall fails to download Chrome on Node 26 (yargs
      # ESM, D20) but exits 0. Download it through nyc and fail if it is missing.
      - name: Download Chrome for puppeteer
        run: |
          npx nyc --silent node node_modules/puppeteer/install.js
          npx nyc --silent node -e "require('fs').accessSync(require('puppeteer').executablePath())"
      - run: npm run build-pages
      - name: Instantiate github-keys.json
        run: |
          echo "{ \"clientID\": \"clientID\", \"clientSecret\": \"clientSecret\", \"callbackURL\": \"http://localhost:3000/auth/github/callback\"}" > app/auth/github-keys.json
          mkdir test/e2e/auth
          cp app/auth/github-keys.json $_
      - name: Instantiate configuration file
        run: cp cfg.json.example cfg.json
      - name: Instantiate blacklist
        run: echo {} > app/controller/microdrawWebsocketServer/blacklist.json
      - name: Instantiate whitelist
        run: echo "{}" > app/controller/microdrawWebsocketServer/whitelist.json
      - name: Run the server during 5 seconds
        run: timeout 5 npm start && exit 10 || [[ $? -eq 124 ]]
      - name: Run api tests
        run: npm run mocha
      - name: Run e2e tests
        run: npm run test-e2e
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-canary
          path: test/e2e/screenshots/
  
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Invoke deployment hook
        uses: distributhor/workflow-webhook@v1
        env:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
